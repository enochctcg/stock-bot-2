spring:
  application:
    name: stock-bot
  config:
    # 本機用 IntelliJ / mvn 執行時，直接讀專案根目錄的 .env（不存在就略過）
    # 系統環境變數的優先權比 .env 高，所以 docker compose 注入的 DB_HOST=mysql 會覆蓋 .env 的 localhost
    import: optional:file:.env[.properties]
  datasource:
    # MySQL 8.0.19 以上（upsert 用到 INSERT ... AS alias 語法）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stockbot}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Taipei&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:stockbot}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    # 建表改由 Flyway 管理（db/migration/V*.sql），啟動時自動執行尚未跑過的版本
    # 既有資料庫（之前由 schema.sql 建立、沒有 flyway_schema_history）會先標記為 V1，再從 V2 開始執行
    baseline-on-migrate: true
    baseline-version: 1

bot:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
  fugle:
    api-key: ${FUGLE_API_KEY}
    base-url: https://api.fugle.tw/marketdata/v1.0/stock
    # 免費方案日內行情 API 為每分鐘 60 次，保留一些餘裕
    requests-per-minute: 50
    # 同一檔股票在這段時間內重複查詢會直接用快取（/now 連按也不會燒額度）
    cache-ttl: 30s
  # 每位使用者最多可訂閱幾檔
  max-watch-per-user: 20
  # 允許使用的 chat id，逗號分隔；留空代表任何人都能用（不建議，會消耗你的 API 額度）
  allowed-chat-ids: ${ALLOWED_CHAT_IDS:}
  schedule:
    # 交易日盤中每分鐘檢查一次，只推給「這一分鐘輪到」的使用者（時段與間隔由各使用者自行設定）
    cron: "0 * 9-13 * * MON-FRI"

logging:
  level:
    com.eno.stockbot: INFO
