spring:
  application:
    name: stock-bot
  config:
    # 本機用 IntelliJ / mvn 執行時，直接讀專案根目錄的 .env（不存在就略過）
    # 系統環境變數的優先權比 .env 高，所以 docker compose 注入的 DB_HOST=mysql 會覆蓋 .env 的 localhost
    import: optional:file:.env[.properties]
  datasource:
    # MySQL 8.0.19 以上（upsert 用到 INSERT ... AS alias 語法）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stockbot}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Taipei&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:stockbot}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  task:
    scheduling:
      # 排程執行緒名稱，log 裡會顯示為 [push-job-1]
      thread-name-prefix: push-job-
      # 定時推播、報價紀錄、每日 Excel 可能在同一分鐘觸發，避免互相排隊延誤
      pool:
        size: 3
  flyway:
    # 建表改由 Flyway 管理（db/migration/V*.sql），啟動時自動執行尚未跑過的版本
    # 既有資料庫（之前由 schema.sql 建立、沒有 flyway_schema_history）會先標記為 V1，再從 V2 開始執行
    baseline-on-migrate: true
    baseline-version: 1

bot:
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
  fugle:
    api-key: ${FUGLE_API_KEY}
    base-url: https://api.fugle.tw/marketdata/v1.0/stock
    # 免費方案日內行情 API 為每分鐘 60 次，保留一些餘裕
    requests-per-minute: 50
    # 同一檔股票在這段時間內重複查詢會直接用快取（/now 連按也不會燒額度）
    cache-ttl: 30s
  # 每位使用者最多可訂閱幾檔
  max-watch-per-user: 20
  # 允許使用的 chat id，逗號分隔；留空代表任何人都能用（不建議，會消耗你的 API 額度）
  allowed-chat-ids: ${ALLOWED_CHAT_IDS:}
  schedule:
    # 交易日盤中每分鐘檢查一次，只推給「這一分鐘輪到」的使用者（時段與間隔由各使用者自行設定）
    cron: "0 * 9-13 * * MON-FRI"
  history:
    # 觀察清單中所有股票（所有人的聯集）每 30 分鐘記錄一次報價：09:00、09:30 … 13:30
    record-cron: "0 0,30 9-13 * * MON-FRI"
    # 收盤後再記錄一次最終價（13:30 收盤集合競價結果）
    close-cron: "0 35 13 * * MON-FRI"
    # 每天整理成 Excel 推給每位使用者（只含自己的觀察清單；已暫停推播的人不送）
    report-cron: "0 0 14 * * MON-FRI"
    # 歷史報價保留期限，超過的每天自動刪除（1m = 一個月）
    retention: 1m

logging:
  level:
    com.eno.stockbot: INFO
  # 每一行都帶：台北時間（毫秒）、等級、完整執行緒名稱、使用者 chat id / Telegram update id（有的話）
  # 例：2026-11-02 09:10:00.012 INFO  [push-job-1] [chat=987654321 upd=-] IntradayReportJob - 推播 ...
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Taipei} %clr(%-5level) [%thread] [chat=%X{chatId:--} upd=%X{updateId:--}] %clr(%logger{0}){cyan} - %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Taipei} %-5level [%thread] [chat=%X{chatId:--} upd=%X{updateId:--}] %logger{0} - %msg%n%wEx"
  # 同時寫檔：logs/stock-bot.log，超過 10MB 或跨日就切檔，保留 30 天
  file:
    name: logs/stock-bot.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/stock-bot.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
