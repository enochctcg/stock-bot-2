services:
  mysql:
    image: mysql:8.4
    container_name: stock-bot-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-stockbot}
      MYSQL_USER: ${DB_USERNAME:-stockbot}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"          # 方便本機用 DBeaver / IntelliJ 連線；不需要可以拿掉
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  stock-bot:
    build: .
    container_name: stock-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ./logs:/app/logs     # log 檔（logs/stock-bot.log）留在主機上，重建容器不會遺失
    depends_on:
      mysql:
        condition: service_healthy
